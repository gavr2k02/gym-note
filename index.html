<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Gym Tracker</title>
    <style>
      :root {
        --bg: #0a0a0a;
        --card: #1c1c1e;
        --card2: #2c2c2e;
        --accent: #ff6b35;
        --text: #f2f2f7;
        --text2: #8e8e93;
        --success: #30d158;
        --border: #38383a;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue",
          sans-serif;
        overflow: hidden;
      }

      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield;
      }

      /* APP SHELL */
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
        height: 100dvh;
      }

      /* SCREENS */
      .screen {
        display: none;
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 80px;
      }
      .screen.active {
        display: block;
      }
      #screen-workout {
        padding-bottom: 100px;
      }

      /* BOTTOM TAB BAR */
      #tabbar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 72px;
        background: var(--card);
        border-top: 1px solid var(--border);
        display: flex;
        align-items: stretch;
        z-index: 100;
        padding-bottom: env(safe-area-inset-bottom, 0);
      }
      .tab-btn {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        background: none;
        border: none;
        color: var(--text2);
        font-size: 10px;
        cursor: pointer;
        transition: color 0.15s;
        padding: 8px 0;
      }
      .tab-btn.active {
        color: var(--accent);
      }
      .tab-btn svg {
        width: 24px;
        height: 24px;
      }

      /* COMMON */
      .page-header {
        padding: 20px 16px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .page-title {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }
      .page-date {
        font-size: 13px;
        color: var(--text2);
        margin-top: 2px;
      }
      .section-list {
        padding: 0 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* HOME SCREEN */
      .day-card {
        background: var(--card);
        border-radius: 16px;
        padding: 16px;
        cursor: pointer;
        border: 2px solid transparent;
        transition:
          border-color 0.2s,
          transform 0.1s;
        position: relative;
        overflow: hidden;
      }
      .day-card:active {
        transform: scale(0.98);
      }
      .day-card.active-session {
        border-color: var(--accent);
      }
      .day-card-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .day-emoji {
        font-size: 32px;
      }
      .day-meta {
        font-size: 11px;
        color: var(--text2);
        text-align: right;
        line-height: 1.5;
      }
      .day-number {
        font-size: 11px;
        font-weight: 600;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 2px;
      }
      .day-title {
        font-size: 17px;
        font-weight: 700;
        margin-bottom: 2px;
      }
      .day-subtitle {
        font-size: 13px;
        color: var(--text2);
        margin-bottom: 10px;
      }
      .day-stats {
        display: flex;
        gap: 12px;
        font-size: 12px;
        color: var(--text2);
      }
      .day-stat {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .continue-btn {
        margin-top: 12px;
        width: 100%;
        padding: 10px;
        background: var(--accent);
        border: none;
        border-radius: 10px;
        color: white;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }

      /* WORKOUT SCREEN */
      #workout-header {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 16px 16px 8px;
        position: sticky;
        top: 0;
        background: var(--bg);
        z-index: 10;
      }
      #workout-header-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #workout-day-name {
        font-size: 16px;
        font-weight: 700;
        flex: 1;
      }
      #workout-header-right {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }
      #workout-timers {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--card);
        border-radius: 12px;
        padding: 8px 12px;
      }
      .timer-block {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .timer-icon {
        font-size: 13px;
        opacity: 0.7;
      }
      .timer-value {
        font-size: 15px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.5px;
      }
      .timer-sublabel {
        font-size: 11px;
        color: var(--text2);
        font-weight: 500;
      }
      #workout-rest-timer.ready {
        color: var(--success);
      }
      #workout-finish-header-btn {
        background: rgba(48, 209, 88, 0.15);
        color: var(--success);
        border: 1px solid rgba(48, 209, 88, 0.35);
        border-radius: 10px;
        padding: 7px 13px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }
      #workout-close-btn {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--card2);
        border: none;
        color: var(--text2);
        font-size: 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      #workout-progress {
        padding: 8px 16px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #workout-progress-text {
        font-size: 12px;
        color: var(--text2);
        flex-shrink: 0;
      }
      #workout-dots {
        display: flex;
        gap: 0;
        flex-wrap: wrap;
        flex: 1;
        align-items: center;
      }
      .progress-dot {
        cursor: pointer;
        /* visual size 10px, tap target ~34px via padding */
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--card2);
        transition:
          background 0.2s,
          transform 0.15s;
        padding: 12px;
        background-clip: content-box;
        box-sizing: content-box;
      }
      .progress-dot:active {
        transform: scale(1.4);
      }
      .progress-dot.done {
        background: var(--success);
        background-clip: content-box;
      }
      .progress-dot.current {
        background: var(--accent);
        background-clip: content-box;
        transform: scale(1.2);
      }

      #exercise-card {
        margin: 0 16px 16px;
        background: var(--card);
        border-radius: 18px;
        padding: 16px;
      }
      .slide-from-right {
        animation: slideFromRight 0.22s ease;
      }
      .slide-from-left {
        animation: slideFromLeft 0.22s ease;
      }
      @keyframes slideFromRight {
        from {
          opacity: 0;
          transform: translateX(40px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      @keyframes slideFromLeft {
        from {
          opacity: 0;
          transform: translateX(-40px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .exercise-group-label {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.8px;
        background: rgba(255, 107, 53, 0.12);
        padding: 3px 8px;
        border-radius: 6px;
        margin-bottom: 0;
      }
      .exercise-header-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .optional-badge {
        font-size: 10px;
        font-weight: 600;
        color: var(--text2);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        background: rgba(142, 142, 147, 0.1);
        border: 1px dashed rgba(142, 142, 147, 0.35);
        padding: 2px 7px;
        border-radius: 6px;
      }
      .exercise-name.optional {
        opacity: 0.65;
      }
      .progress-dot.optional-ex {
        opacity: 0.45;
      }
      .exercise-name {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.3px;
        line-height: 1.2;
        margin-bottom: 6px;
      }
      .exercise-target {
        font-size: 13px;
        color: var(--text2);
        margin-bottom: 4px;
      }
      .exercise-hint {
        font-size: 12px;
        margin-bottom: 16px;
        min-height: 16px;
        line-height: 1.6;
      }
      .hint-prev {
        color: var(--text2);
      }
      .hint-sugg {
        font-weight: 700;
      }
      .hint-sugg-weight {
        color: #30d158;
        font-weight: 700;
      }
      .hint-sugg-reps {
        color: var(--accent);
        font-weight: 700;
      }

      /* SETS TABLE */
      .sets-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }
      .sets-table th {
        font-size: 10px;
        font-weight: 600;
        color: var(--text2);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 0 0 8px 0;
        text-align: left;
      }
      .sets-table th:first-child {
        width: 24px;
      }
      .sets-table th.col-check {
        width: 40px;
        text-align: center;
      }
      .set-row td {
        padding: 4px 0;
        vertical-align: middle;
      }
      .set-num {
        font-size: 13px;
        color: var(--text2);
        font-weight: 600;
        width: 28px;
      }
      .set-input {
        background: var(--card2);
        border: 1.5px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-size: 15px;
        font-weight: 600;
        text-align: center;
        padding: 6px 2px;
        width: 100%;
        outline: none;
        transition: border-color 0.15s;
        min-height: 40px;
      }
      .set-input:focus {
        border-color: var(--accent);
      }
      .set-input.filled {
        border-color: var(--success);
      }
      td.col-weight {
        padding-right: 4px;
      }
      td.col-reps {
        padding-right: 4px;
      }
      td.col-check {
        text-align: center;
        width: 36px;
      }
      .set-check {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2px solid var(--border);
        background: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
        transition: all 0.15s;
        flex-shrink: 0;
      }
      .set-check.done {
        background: var(--success);
        border-color: var(--success);
      }
      .set-check svg {
        width: 14px;
        height: 14px;
      }
      .stepper {
        display: flex;
        align-items: center;
        gap: 3px;
      }
      .stepper .set-input {
        width: auto;
        flex: 1;
        min-width: 40px;
      }
      .stepper-btn {
        width: 28px;
        min-height: 40px;
        border: 1.5px solid var(--border);
        background: var(--card2);
        border-radius: 8px;
        color: var(--text);
        font-size: 20px;
        font-weight: 300;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: opacity 0.1s;
      }
      .stepper-btn:active {
        opacity: 0.5;
      }

      /* WARMUP ROWS */
      .set-row.warmup td {
        padding-top: 3px;
        padding-bottom: 3px;
      }
      .set-row.warmup .set-num {
        font-size: 9px;
        font-weight: 700;
        color: #64d2ff;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        width: 28px;
      }
      .set-row.warmup .set-input {
        background: var(--bg);
        border-color: #2a3a42;
        color: #64d2ff;
        font-size: 13px;
        opacity: 0.85;
      }
      .set-row.warmup .set-input.filled {
        border-color: #3a5a6a;
      }
      .set-row.warmup .stepper-btn {
        background: var(--bg);
        border-color: #2a3a42;
        color: #64d2ff;
        opacity: 0.75;
      }
      .set-row.warmup .set-check {
        border-color: #2a3a42;
        opacity: 0.6;
      }
      .set-row.warmup .set-check.done {
        background: #1a4a5a;
        border-color: #64d2ff;
      }
      .warmup-divider td {
        padding: 4px 0 2px;
      }
      .warmup-divider-line {
        height: 1px;
        background: var(--border);
        width: 100%;
      }

      /* WORKOUT NAV */
      #workout-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 12px 16px;
        padding-bottom: calc(12px + env(safe-area-inset-bottom, 0));
        background: var(--bg);
        border-top: 1px solid var(--border);
        display: flex;
        gap: 10px;
        z-index: 50;
      }
      .nav-btn {
        flex: 1;
        padding: 14px;
        border-radius: 14px;
        border: none;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.1s;
        min-height: 50px;
      }
      .nav-btn:active {
        transform: scale(0.97);
      }
      #btn-prev {
        background: var(--card2);
        color: var(--text2);
        flex: 0 0 auto;
        width: 50px;
        padding: 14px 10px;
      }
      #btn-next {
        background: var(--accent);
        color: white;
      }
      #btn-finish {
        background: var(--success);
        color: white;
      }

      /* FINISH PREVIEW MODAL */
      .finish-preview {
        display: flex;
        flex-direction: column;
        max-height: 75vh;
      }
      .finish-preview-header {
        text-align: center;
        margin-bottom: 14px;
      }
      .finish-preview-emoji {
        font-size: 36px;
        margin-bottom: 6px;
      }
      .finish-preview-title {
        font-size: 20px;
        font-weight: 700;
      }
      .finish-preview-sub {
        color: var(--text2);
        font-size: 13px;
        margin-top: 3px;
      }
      .finish-stats-row {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
      }
      .finish-stat {
        flex: 1;
        background: var(--card2);
        border-radius: 12px;
        padding: 10px 6px;
        text-align: center;
      }
      .finish-stat-val {
        font-size: 24px;
        font-weight: 700;
        color: var(--accent);
        line-height: 1;
      }
      .finish-stat-lbl {
        font-size: 10px;
        color: var(--text2);
        margin-top: 3px;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }
      .finish-ex-scroll {
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        flex: 1;
        margin-bottom: 14px;
      }
      .finish-ex-row {
        padding: 9px 0;
        border-bottom: 1px solid var(--border);
      }
      .finish-ex-row:last-child {
        border-bottom: none;
      }
      .finish-ex-name {
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 5px;
      }
      .finish-sets-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .set-chip {
        border-radius: 6px;
        padding: 3px 8px;
        font-size: 11px;
        font-weight: 600;
      }
      .set-chip.filled {
        background: rgba(48, 209, 88, 0.15);
        color: var(--success);
      }
      .set-chip.empty {
        background: var(--card2);
        color: var(--text2);
        opacity: 0.5;
      }
      .finish-modal-actions {
        display: flex;
        gap: 10px;
      }
      .btn-finish-cancel {
        padding: 14px 18px;
        background: var(--card2);
        color: var(--text);
        border: none;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        flex-shrink: 0;
      }
      .btn-finish-confirm {
        flex: 1;
        padding: 14px;
        background: var(--success);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
      .calorie-input-row {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--card2);
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 14px;
      }
      .calorie-icon {
        font-size: 22px;
        flex-shrink: 0;
      }
      .calorie-input {
        flex: 1;
        background: none;
        border: none;
        color: var(--text);
        font-size: 20px;
        font-weight: 700;
        outline: none;
        min-width: 0;
      }
      .calorie-input::placeholder {
        color: var(--text2);
        font-weight: 400;
        font-size: 16px;
      }
      .calorie-unit {
        color: var(--text2);
        font-size: 13px;
        font-weight: 600;
        flex-shrink: 0;
      }

      /* COMPLETE SCREEN */
      #complete-screen {
        padding: 24px 16px;
      }
      .complete-header {
        text-align: center;
        margin-bottom: 24px;
      }
      .complete-emoji {
        font-size: 56px;
        margin-bottom: 12px;
      }
      .complete-title {
        font-size: 26px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .complete-sub {
        font-size: 15px;
        color: var(--text2);
      }
      .complete-stats {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      .complete-stat-card {
        flex: 1;
        background: var(--card);
        border-radius: 14px;
        padding: 14px 10px;
        text-align: center;
      }
      .complete-stat-val {
        font-size: 22px;
        font-weight: 700;
        color: var(--accent);
      }
      .complete-stat-lbl {
        font-size: 11px;
        color: var(--text2);
        margin-top: 2px;
      }
      .complete-exercises {
        background: var(--card);
        border-radius: 16px;
        overflow: hidden;
        margin-bottom: 20px;
      }
      .complete-ex-item {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
      }
      .complete-ex-item:last-child {
        border-bottom: none;
      }
      .complete-ex-name {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .complete-ex-sets {
        font-size: 12px;
        color: var(--text2);
      }
      .complete-ex-prev {
        font-size: 11px;
        color: var(--text2);
        margin-top: 4px;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px;
        opacity: 0.7;
      }
      .complete-ex-prev-label {
        font-weight: 600;
        color: var(--text2);
        flex-shrink: 0;
      }
      .complete-ex-prev-sets {
        flex: 1;
      }
      .complete-ex-prev .delta-up,
      .complete-ex-prev .delta-down,
      .complete-ex-prev .delta-same {
        font-size: 11px;
        font-weight: 700;
        flex-shrink: 0;
        opacity: 1;
      }
      .complete-actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .btn-primary {
        width: 100%;
        padding: 16px;
        background: var(--accent);
        border: none;
        border-radius: 14px;
        color: white;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        min-height: 54px;
      }
      .btn-secondary {
        width: 100%;
        padding: 16px;
        background: var(--card);
        border: none;
        border-radius: 14px;
        color: var(--text);
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        min-height: 54px;
      }

      /* HISTORY SCREEN */
      .history-header {
        padding: 20px 16px 12px;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
      }
      .history-count {
        font-size: 13px;
        color: var(--text2);
      }
      .history-empty {
        text-align: center;
        padding: 60px 32px;
        color: var(--text2);
      }
      .history-empty-icon {
        font-size: 48px;
        margin-bottom: 12px;
      }
      .history-empty-text {
        font-size: 16px;
      }
      .backup-section {
        margin: 0 16px 16px;
        background: var(--card);
        border-radius: 14px;
        padding: 16px;
      }
      .backup-title {
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .backup-last {
        font-size: 12px;
        color: var(--text2);
        margin-bottom: 14px;
      }
      .backup-btns {
        display: flex;

      let restTimerInterval = null;

      function getActiveProgram() {
        return programs.find((p) => p.id === activeProgramId);
      }
      function getActiveDays() {
        return getActiveProgram()?.days || [];
      }

      // =====================================================
      // STORAGE
      // =====================================================
      function loadData() {
        // Load programs
        const savedPrograms = localStorage.getItem("gymNote_programs");
        if (savedPrograms) {
          programs = JSON.parse(savedPrograms);
        } else {
          // Migrate old gymNote_plan or use DEFAULT_PROGRAMS
          const oldPlan = localStorage.getItem("gymNote_plan");
          if (oldPlan) {
            programs = [
              {
                id: "prog_fullbody",
                name: "Фуллбади",
                emoji: "💪",
                days: JSON.parse(oldPlan),
              },
              JSON.parse(JSON.stringify(DEFAULT_PROGRAMS[1])),
            ];
            localStorage.removeItem("gymNote_plan");
          } else {
            programs = JSON.parse(JSON.stringify(DEFAULT_PROGRAMS));
          }
          savePrograms();
        }
        // Migrate null groups from DEFAULT_PROGRAMS
        programs.forEach((prog) => {
          const defProg = DEFAULT_PROGRAMS.find((p) => p.id === prog.id);
          if (!defProg) return;
          prog.days.forEach((day, di) => {
            day.exercises.forEach((ex, ei) => {
              if (ex.group === null && defProg.days[di]?.exercises[ei]?.group) {
                ex.group = defProg.days[di].exercises[ei].group;
              }
            });
          });
        });

        activeProgramId =
          localStorage.getItem("gymNote_activeProgramId") ||
          programs[0]?.id ||
          "";

        const savedSession = localStorage.getItem("gymNote_session");
        session = savedSession ? JSON.parse(savedSession) : null;
        const savedHistory = localStorage.getItem("gymNote_history");
        history = savedHistory ? JSON.parse(savedHistory) : [];
      }

      function savePrograms() {
        localStorage.setItem("gymNote_programs", JSON.stringify(programs));
      }
      function saveActiveProgramId() {
        localStorage.setItem("gymNote_activeProgramId", activeProgramId);
      }
      function saveSession() {
        localStorage.setItem("gymNote_session", JSON.stringify(session));
      }
      function clearSession() {
        localStorage.removeItem("gymNote_session");
        localStorage.removeItem("gymNote_restStartTime");
        session = null;
        stopWorkoutTimers();
      }
      function saveHistory() {
        localStorage.setItem("gymNote_history", JSON.stringify(history));
      }

      // =====================================================
      // TIMERS
      // =====================================================
      function fmtTimerSec(totalSec) {
        const h = Math.floor(totalSec / 3600);
        const m = Math.floor((totalSec % 3600) / 60);
        const s = totalSec % 60;
        if (h > 0)
          return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
        return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
      }

      function startWorkoutTimers(resumeRest = false) {
        stopWorkoutTimers();
        workoutTimerInterval = setInterval(() => {
          if (!session) return;
          const el = document.getElementById("workout-total-timer");
          if (!el) return;
          el.textContent = fmtTimerSec(
            Math.floor((Date.now() - session.startTime) / 1000),
          );
        }, 1000);
        if (resumeRest) {
          const saved = localStorage.getItem("gymNote_restStartTime");
          restStartTime = saved ? parseInt(saved) : Date.now();
        } else {
          resetRestTimer();
        }
        startRestTimerInterval();
      }

      function resetRestTimer() {
        restStartTime = Date.now();
        localStorage.setItem("gymNote_restStartTime", restStartTime);
        if (restTimerInterval) clearInterval(restTimerInterval);
        startRestTimerInterval();
      }

      function startRestTimerInterval() {
        if (restTimerInterval) clearInterval(restTimerInterval);
        restTimerInterval = setInterval(() => {
          const el = document.getElementById("workout-rest-timer");
          if (!el) return;
          const sec = Math.floor((Date.now() - restStartTime) / 1000);
          el.textContent = fmtTimerSec(sec);
          el.classList.toggle("ready", sec >= REST_RECOMMENDATION_SEC);
        }, 1000);
      }

      function stopWorkoutTimers() {
        clearInterval(workoutTimerInterval);
        clearInterval(restTimerInterval);
        workoutTimerInterval = null;
        restTimerInterval = null;
        restStartTime = null;
      }

      // =====================================================
      // NAVIGATION
      // =====================================================
      function switchTab(tab) {
        if (tab === "workout" && !session) {
          // if no session, go home and do nothing
          tab = "home";
        }
        currentTab = tab;
        document
          .querySelectorAll(".screen")
          .forEach((s) => s.classList.remove("active"));
        document.querySelectorAll(".tab-btn").forEach((b) => {
          b.classList.toggle("active", b.dataset.tab === tab);
        });

        const screenMap = {
          home: "screen-home",
          workout: "screen-workout",
          history: "screen-history",
          program: "screen-program",
        };
        const screenEl = document.getElementById(screenMap[tab]);
        if (screenEl) screenEl.classList.add("active");

        if (tab === "home") renderHome();
        if (tab === "workout" && session) renderWorkout();
        if (tab === "history") renderHistory();
        if (tab === "program") renderProgram();
      }

      // =====================================================
      function renderHome() {
        const dateEl = document.getElementById("home-date");
        const now = new Date();
        dateEl.textContent = now.toLocaleDateString("ru-RU", {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric",
        });

        // Render program chips
        const chipsEl = document.getElementById("program-chips");
        chipsEl.innerHTML =
          programs
            .map(
              (p) => `
    <div class="program-chip ${p.id === activeProgramId ? "active" : ""}" onclick="switchProgram('${p.id}')">
      <span class="program-chip-emoji">${p.emoji}</span>
      <span class="program-chip-name">${p.name}</span>
    </div>
  `,
            )
            .join("") +
          `<div class="program-chip add-chip" onclick="showProgramManager()"><span>+</span></div>`;

        const container = document.getElementById("day-cards");
        container.innerHTML = "";
        getActiveDays().forEach((day) => {
          const isActive = session && session.dayId === day.id;
          const card = document.createElement("div");
          card.className = "day-card" + (isActive ? " active-session" : "");
          card.innerHTML = `
      <div class="day-card-top">
        <div class="day-emoji">${day.emoji}</div>
        <div class="day-meta">
          <div>${day.dayOfWeek}</div>
          <div>${day.duration}</div>
          <div>${day.exercises.length} упражнений</div>
        </div>
      </div>
      <div class="day-number">День ${day.id}</div>
      <div class="day-title">${day.name}</div>
      <div class="day-subtitle">${day.subtitle}</div>
      ${isActive ? `<button class="continue-btn" onclick="continueSession(event)">Продолжить →</button>` : ""}
    `;
          card.addEventListener("click", () => startOrOpenDay(day.id));
          container.appendChild(card);
        });
      }

      function startOrOpenDay(dayId) {
        const day = getActiveDays().find((d) => d.id === dayId);
        if (!day) return;

        if (session && session.dayId === dayId) {
          switchTab("workout");
          return;
        }

        if (session && session.dayId !== dayId) {
          showConfirm(
            "Активная тренировка",
            `Сейчас идёт тренировка "${session.dayName}". Начать новую?`,
            () => {
              clearSession();
              startSession(day);
            },
          );
          return;
        }

        startSession(day);
      }

      function continueSession(e) {
        e.stopPropagation();
        switchTab("workout");
      }

      function startSession(day) {
        const exercises = day.exercises.map((ex) => {
          const prog = getProgressionTarget(
            day.id,
            ex.id,
            parseInt(ex.repsTarget),
          );
          const fillWeight = prog ? String(prog.weight) : "";
          const fillReps = prog ? String(prog.reps) : "";
          const warmupCount = ex.warmupSets || 0;
          const warmupSets = Array.from({ length: warmupCount }, () => ({
            weight: "", reps: "", done: false, isWarmup: true,
          }));
          const workingSets = Array.from({ length: ex.setsTarget }, () => ({
            weight: fillWeight, reps: fillReps, done: false,
          }));
          return {
            exId: ex.id,
            name: ex.name,
            setsTarget: ex.setsTarget,
            warmupSets: warmupCount,
            repsTarget: ex.repsTarget,
            group: ex.group,
            optional: ex.optional || false,
            sets: [...warmupSets, ...workingSets],
          };
        });

        session = {
          dayId: day.id,
          dayName: day.name,
          startTime: Date.now(),
          currentExIndex: 0,
          exercises,
        };
        saveSession();
        startWorkoutTimers();
        switchTab("workout");
      }

      // =====================================================
      // WORKOUT SCREEN
      // =====================================================
      function renderWorkout() {
        if (!session) return;
        const ex = session.exercises[session.currentExIndex];
        const total = session.exercises.length;
        const idx = session.currentExIndex;
        const progDay = getActiveDays().find((d) => d.id === session.dayId);
        // resolve optional from program (source of truth), fallback to session field
        session.exercises.forEach((e) => {
          const pe = progDay?.exercises.find((p) => p.id === e.exId);
          if (pe?.optional) e.optional = true;
        });

        document.getElementById("workout-day-name").textContent =
          session.dayName;
        document.getElementById("workout-progress-text").textContent =
          `${idx + 1} / ${total}`;

        // Dots
        const dotsEl = document.getElementById("workout-dots");
        dotsEl.innerHTML = "";
        session.exercises.forEach((e, i) => {
          const dot = document.createElement("div");
          const workingSets = e.sets.filter((s) => !s.isWarmup);
          const filled =
            workingSets.length > 0 &&
            workingSets.every((s) => s.done);
          let cls = "progress-dot";
          if (i === idx) cls += " current";
          else if (filled) cls += " done";
          dot.className = cls;
          if (e.optional) dot.classList.add("optional-ex");
          dot.title = session.exercises[i].name;
          dot.onclick = () => goToExercise(i);
          dotsEl.appendChild(dot);
        });

        // Previous hint
        const hint = getPreviousHint(
          session.dayId,
          ex.exId,
          parseInt(ex.repsTarget),
        );

        // Build sets rows
        const warmupCount = ex.warmupSets || 0;
        let workingNum = 0;
        const setsHTML = ex.sets
          .map((set, si) => {
            const isWarmup = !!set.isWarmup;
            const label = isWarmup ? "Разм." : ++workingNum;
            const rowClass = isWarmup ? "set-row warmup" : "set-row";
            const divider = !isWarmup && workingNum === 1 && warmupCount > 0
              ? `<tr class="warmup-divider"><td colspan="4"><div class="warmup-divider-line"></div></td></tr>`
              : "";
            return `${divider}
    <tr class="${rowClass}" data-set="${si}">
      <td class="set-num">${label}</td>
      <td class="col-weight">
        <div class="stepper">
          <button class="stepper-btn" onclick="stepField(${si}, 'weight', -2.5)">−</button>
          <input class="set-input ${set.weight !== "" ? "filled" : ""}"
            type="number" inputmode="decimal" placeholder="–"
            value="${set.weight !== "" ? set.weight : ""}"
            data-field="weight" data-set="${si}"
            onchange="updateSet(${si}, 'weight', this.value)"
            oninput="onSetInput(${si}, 'weight', this.value)"
          >
          <button class="stepper-btn" onclick="stepField(${si}, 'weight', 2.5)">+</button>
        </div>
      </td>
      <td class="col-reps">
        <div class="stepper">
          <button class="stepper-btn" onclick="stepField(${si}, 'reps', -1)">−</button>
          <input class="set-input ${set.reps !== "" ? "filled" : ""}"
            type="number" inputmode="numeric" placeholder="–"
            value="${set.reps !== "" ? set.reps : ""}"
            data-field="reps" data-set="${si}"
            onchange="updateSet(${si}, 'reps', this.value)"
            oninput="onSetInput(${si}, 'reps', this.value)"
          >
          <button class="stepper-btn" onclick="stepField(${si}, 'reps', 1)">+</button>
        </div>
      </td>
      <td class="col-check">
        <button class="set-check ${set.done ? "done" : ""}" onclick="toggleSetDone(${si})">
          ${set.done ? `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>` : ""}
        </button>
      </td>
    </tr>`;
          })
          .join("");

        const headerParts = [
          ex.group ? `<div class="exercise-group-label">${ex.group}</div>` : "",
          ex.optional ? `<span class="optional-badge">необязательно</span>` : "",
        ].filter(Boolean).join("");
        const cardHTML = `
    ${headerParts ? `<div class="exercise-header-row">${headerParts}</div>` : ""}
    <div class="exercise-name${ex.optional ? " optional" : ""}">${ex.name}</div>
    <div class="exercise-target">${warmupCount > 0 ? `${warmupCount} разм. + ` : ""}${ex.setsTarget} × ${ex.repsTarget} повт.</div>
    <div class="exercise-hint">${hint}</div>
    <table class="sets-table">
      <thead>
        <tr>
          <th>№</th>
          <th>ВЕС (кг)</th>
          <th>ПОВТ.</th>
          <th class="col-check"></th>
        </tr>
      </thead>
      <tbody id="sets-tbody">
        ${setsHTML}
      </tbody>
    </table>
  `;
        const cardEl = document.getElementById("exercise-card");
        cardEl.innerHTML = cardHTML;
        // Direction animation
        cardEl.classList.remove("slide-from-right", "slide-from-left");
        void cardEl.offsetWidth; // reflow
        cardEl.classList.add(
          swipeDir >= 0 ? "slide-from-right" : "slide-from-left",
        );

        // Nav buttons
        document.getElementById("btn-prev").style.display =
          idx === 0 ? "none" : "block";
        const isLast = idx === total - 1;
        document.getElementById("btn-next").style.display = isLast
          ? "none"
          : "block";
        document.getElementById("btn-finish").style.display = isLast
          ? "block"
          : "none";
      }

      // Returns { weight, reps, prevSetsText, isWeightIncrease } or null if no history
      function getProgressionTarget(dayId, exId, repsTarget) {
        const pastSessions = history.filter((h) => h.dayId === dayId);
        if (!pastSessions.length) return null;
        const last = pastSessions[pastSessions.length - 1];
        const exData = last.exercises.find((e) => e.exId === exId);
        if (!exData || !exData.sets.length) return null;

        const filledSets = exData.sets.filter(
          (s) =>
            !s.isWarmup &&
            ((s.weight !== "" && s.weight !== null) ||
            (s.reps !== "" && s.reps !== null)),
        );
        if (!filledSets.length) return null;

        const prevSetsText = filledSets
          .map((s) => {
            const w = s.weight !== "" && s.weight !== null ? s.weight : "–";
            const r = s.reps !== "" && s.reps !== null ? s.reps : "–";
            return `${w}×${r}`;
          })
          .join("  ");

        const weights = filledSets
          .map((s) => parseFloat(s.weight))
          .filter((w) => !isNaN(w));
        if (!weights.length)
          return {
            weight: "",
            reps: "",
            prevSetsText,
            isWeightIncrease: false,
          };

        const maxWeight = Math.max(...weights);
        const workingSets = filledSets.filter(
          (s) => parseFloat(s.weight) === maxWeight,
        );
        const repsArr = workingSets
          .map((s) => parseInt(s.reps))
          .filter((r) => !isNaN(r));
        if (!repsArr.length)
          return {
            weight: maxWeight,
            reps: repsTarget || 10,
            prevSetsText,
            isWeightIncrease: false,
          };

        const target = repsTarget || 10;
        const minReps = Math.min(...repsArr);
        const avgReps = Math.round(
          repsArr.reduce((a, b) => a + b, 0) / repsArr.length,
        );

        if (minReps >= target) {
          return {
            weight: Math.round((maxWeight + 2.5) * 10) / 10,
            reps: target,
            prevSetsText,
            isWeightIncrease: true,
          };
        } else {
          return {
            weight: maxWeight,
            reps: avgReps + 1,
            prevSetsText,
            isWeightIncrease: false,
          };
        }
      }

      function getPreviousHint(dayId, exId, repsTarget) {
        const prog = getProgressionTarget(dayId, exId, repsTarget);
        if (!prog) return "";
        const prevLine = `<span class="hint-prev">Прошлый: ${prog.prevSetsText}</span>`;
        if (!prog.weight && !prog.reps) return prevLine;
        const suggHTML = prog.isWeightIncrease
          ? `<span class="hint-sugg-weight">↑ Цель: ${prog.weight} кг × ${prog.reps} повт (+2.5 кг)</span>`
          : `<span class="hint-sugg-reps">→ Цель: ${prog.weight} кг × ${prog.reps} повт (+1 повт)</span>`;
        return `${prevLine}<br>${suggHTML}`;
      }

      function onSetInput(setIdx, field, value) {
        updateSet(setIdx, field, value);
      }

      function updateSet(setIdx, field, value) {
        const ex = session.exercises[session.currentExIndex];
        const parsed =
          value === ""
            ? ""
            : field === "weight"
              ? parseFloat(value)
              : parseInt(value);
        ex.sets[setIdx][field] = parsed;
        // Update input styling
        const inp = document.querySelector(
          `input[data-field="${field}"][data-set="${setIdx}"]`,
        );
        if (inp) inp.classList.toggle("filled", value !== "");
        saveSession();
      }

      function stepField(setIdx, field, delta) {
        const ex = session.exercises[session.currentExIndex];
        const current = parseFloat(ex.sets[setIdx][field]) || 0;
        let next = Math.round((current + delta) * 10) / 10;
        let value;
        if (field === "reps") {
          next = Math.max(0, Math.round(next));
          value = next > 0 ? String(next) : "";
        } else {
          value = String(next);
        }
        updateSet(setIdx, field, value);
        const inp = document.querySelector(
          `input[data-field="${field}"][data-set="${setIdx}"]`,
        );
        if (inp) {
          inp.value = value;
          inp.classList.toggle("filled", value !== "");
        }
        document.querySelectorAll(".progress-dot").forEach((dot, i) => {
          const e = session.exercises[i];
          const ws = e.sets.filter((s) => !s.isWarmup);
          const filled = ws.length > 0 && ws.every((s) => s.done);
          dot.className =
            "progress-dot" +
            (i === session.currentExIndex ? " current" : filled ? " done" : "");
        });
      }

      function toggleSetDone(setIdx) {
        const ex = session.exercises[session.currentExIndex];
        ex.sets[setIdx].done = !ex.sets[setIdx].done;
        if (ex.sets[setIdx].done) resetRestTimer();
        saveSession();
        renderWorkout();
      }

      function addSet() {
        const ex = session.exercises[session.currentExIndex];
        const lastSet =
          ex.sets.length > 0
            ? ex.sets[ex.sets.length - 1]
            : { weight: "", reps: "" };
        ex.sets.push({ weight: lastSet.weight, reps: "", done: false });
        saveSession();
        renderWorkout();
        // Scroll to new set
        setTimeout(() => {
          const card = document.getElementById("exercise-card");
          card.scrollIntoView({ behavior: "smooth", block: "end" });
        }, 50);
      }

      function prevExercise() {
        if (session.currentExIndex > 0) {
          swipeDir = -1;
          session.currentExIndex--;
          saveSession();
          renderWorkout();
          scrollWorkoutTop();
        }
      }

      function nextExercise() {
        if (session.currentExIndex < session.exercises.length - 1) {
          swipeDir = 1;
          session.currentExIndex++;
          saveSession();
          renderWorkout();
          scrollWorkoutTop();
        }
      }

      function scrollWorkoutTop() {
        const screen = document.getElementById("screen-workout");
        screen.scrollTo({ top: 0, behavior: "smooth" });
      }

      function goToExercise(idx) {
        if (!session || idx === session.currentExIndex) return;
        swipeDir = idx > session.currentExIndex ? 1 : -1;
        session.currentExIndex = idx;
        saveSession();
        renderWorkout();
        scrollWorkoutTop();
      }

      function initSwipeListeners() {
        const screen = document.getElementById("screen-workout");
        let startX = 0,
          startY = 0,
          swiping = false;
        screen.addEventListener(
          "touchstart",
          (e) => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            swiping = false;
          },
          { passive: true },
        );
        screen.addEventListener(
          "touchmove",
          (e) => {
            if (swiping) return;
            const dx = e.touches[0].clientX - startX;
            const dy = e.touches[0].clientY - startY;
            // Cancel swipe if vertical movement dominates early
            if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 10)
              swiping = true; // mark as scroll
          },
          { passive: true },
        );
        screen.addEventListener(
          "touchend",
          (e) => {
            if (!session) return;
            const dx = e.changedTouches[0].clientX - startX;
            const dy = e.changedTouches[0].clientY - startY;
            if (swiping) return; // was a scroll, ignore
            if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 2) {
              if (dx < 0) nextExercise();
              else prevExercise();
            }
          },
          { passive: true },
        );
      }

      function confirmClose() {
        showConfirm(
          "Завершить тренировку?",
          "Прогресс сохранён. Вы можете продолжить позже.",
          () => {
            switchTab("home");
          },
          null,
          "Выйти",
          "Отмена",
        );
      }

      function confirmFinishWorkout() {
        if (!session) return;
        const durationMin = Math.round(
          (Date.now() - session.startTime) / 60000,
        );
        const totalSets = session.exercises.reduce(
          (acc, ex) =>
            acc +
            ex.sets.filter((s) => s.weight !== "" || s.reps !== "").length,
          0,
        );
        const filledExCount = session.exercises.filter((ex) =>
          ex.sets.some((s) => s.weight !== "" || s.reps !== ""),
        ).length;

        const exListHTML = session.exercises
          .map((ex) => {
            const chips = ex.sets
              .map((s) => {
                const isFilled = s.weight !== "" || s.reps !== "";
                const label = isFilled
                  ? `${s.weight || "–"}×${s.reps || "–"}`
                  : "─";
                return `<span class="set-chip ${isFilled ? "filled" : "empty"}">${label}</span>`;
              })
              .join("");
            return `
      <div class="finish-ex-row">
        <div class="finish-ex-name">${ex.name}</div>
        <div class="finish-sets-chips">${chips || '<span class="set-chip empty">нет данных</span>'}</div>
      </div>`;
          })
          .join("");

        showModal(`
    <div class="finish-preview">
      <div class="finish-preview-header">
        <div class="finish-preview-emoji">🏆</div>
        <div class="finish-preview-title">Завершить тренировку?</div>
        <div class="finish-preview-sub">${session.dayName}</div>
      </div>
      <div class="finish-stats-row">
        <div class="finish-stat">
          <div class="finish-stat-val">${durationMin}</div>
          <div class="finish-stat-lbl">минут</div>
        </div>
        <div class="finish-stat">
          <div class="finish-stat-val">${filledExCount}</div>
          <div class="finish-stat-lbl">упражнений</div>
        </div>
        <div class="finish-stat">
          <div class="finish-stat-val">${totalSets}</div>
          <div class="finish-stat-lbl">подходов</div>
        </div>
      </div>
      <div class="finish-ex-scroll">${exListHTML}</div>
      <div class="calorie-input-row">
        <span class="calorie-icon">🔥</span>
        <input type="number" inputmode="numeric" id="calorie-input" class="calorie-input" placeholder="Калории (необязательно)">
        <span class="calorie-unit">ккал</span>
      </div>
      <div class="finish-modal-actions">
        <button class="btn-finish-cancel" onclick="closeModal()">Отмена</button>
        <button class="btn-finish-confirm" onclick="finishWorkout(document.getElementById('calorie-input').value); closeModal();">Завершить</button>
      </div>
    </div>
  `);
      }

      function finishWorkout(caloriesRaw) {
        const endTime = Date.now();
        const durationMs = endTime - session.startTime;
        const durationMin = Math.round(durationMs / 60000);
        const durationStr = `${durationMin} мин`;

        const dateStr = new Date().toLocaleDateString("ru-RU", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
        });
        const dateISO = new Date().toISOString().split("T")[0];
        const calories = caloriesRaw ? parseInt(caloriesRaw) : null;

        const record = {
          id: Date.now(),
          date: dateStr,
          dateISO: dateISO,
          dayId: session.dayId,
          dayName: session.dayName,
          duration: durationStr,
          durationMin,
          calories,
          exercises: session.exercises.map((ex) => ({
            exId: ex.exId,
            name: ex.name,
            group: ex.group || null,
            sets: ex.sets.map((s, i) => ({
              set: i + 1,
              weight: s.weight,
              reps: s.reps,
              done: s.done,
              isWarmup: s.isWarmup || false,
            })),
          })),
        };

        history.push(record);
        saveHistory();
        stopWorkoutTimers();
        clearSession();

        renderCompleteScreen(record);
        document
          .querySelectorAll(".screen")
          .forEach((s) => s.classList.remove("active"));
        document.getElementById("screen-complete").classList.add("active");
        document
          .querySelectorAll(".tab-btn")
          .forEach((b) => b.classList.remove("active"));
      }

      function buildExportData(record) {
        const data = {
          date: record.dateISO,
          day: record.dayName,
          duration: record.duration,
          exercises: record.exercises.map((ex) => ({
            name: ex.name,
            sets: ex.sets
              .filter((s) => s.weight !== "" || s.reps !== "")
              .map((s) => ({ set: s.set, weight: s.weight, reps: s.reps })),
          })),
        };
        if (record.calories) data.calories_kcal = record.calories;
        return data;
      }

      function exportAndShare(record) {
        const data = buildExportData(record);
        const json = JSON.stringify(data, null, 2);
        const blob = new Blob([json], { type: "application/json" });
        const fileName = `workout_${record.dateISO}_${record.dayId}.json`;

        if (navigator.canShare) {
          const file = new File([blob], fileName, { type: "application/json" });
          if (navigator.canShare({ files: [file] })) {
            navigator
              .share({
                title: `Тренировка ${record.date}`,
                text: `${record.dayName} · ${record.duration} · ${record.exercises.length} упражнений`,
                files: [file],
              })
              .catch(() => downloadBlob(blob, fileName));
            return;
          }
        }
        downloadBlob(blob, fileName);
      }

      function downloadBlob(blob, fileName) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = fileName;
        a.click();
        URL.revokeObjectURL(url);
      }

      // =====================================================
      // COMPLETE SCREEN
      // =====================================================
      function calcSessionMetrics(rec) {
        let volume = 0,
          maxWeight = 0,
          setsCount = 0;
        rec.exercises.forEach((ex) => {
          ex.sets.forEach((s) => {
            const w = parseFloat(s.weight) || 0;
            const r = parseFloat(s.reps) || 0;
            if (s.weight !== "" || s.reps !== "") setsCount++;
            volume += w * r;
            if (w > maxWeight) maxWeight = w;
          });
        });
        return { volume: Math.round(volume), maxWeight, setsCount };
      }

      function renderCompleteScreen(record) {
        const container = document.getElementById("complete-screen");
        const prevRecord = [...history]
          .slice(0, history.length - 1)
          .reverse()
          .find((h) => h.dayId === record.dayId);

        function fmtDelta(d, unit) {
          if (d === 0) return `<span class="delta-same">без изм.</span>`;
          const sign = d > 0 ? "+" : "";
          const cls = d > 0 ? "delta-up" : "delta-down";
          return `<span class="${cls}">${sign}${d}${unit ? " " + unit : ""}</span>`;
        }

        function exSetsText(sets) {
          return sets
            .filter((s) => s.weight !== "" || s.reps !== "")
            .map((s) => {
              const w = s.weight !== "" ? s.weight : "–";
              const r = s.reps !== "" ? `×${s.reps}` : "";
              return `${w}${r}`;
            })
            .join("  ");
        }

        const exListHTML = record.exercises
          .map((ex) => {
            const curText = exSetsText(ex.sets) || "Нет данных";
            const curMax = Math.max(
              0,
              ...ex.sets.map((s) => parseFloat(s.weight) || 0),
            );

            const prevEx = prevRecord
              ? prevRecord.exercises.find(
                  (e) => e.exId === ex.exId || e.name === ex.name,
                )
              : null;

            let prevHTML = "";
            if (prevEx) {
              const prevText = exSetsText(prevEx.sets) || "–";
              const prevMax = Math.max(
                0,
                ...prevEx.sets.map((s) => parseFloat(s.weight) || 0),
              );
              const d = Math.round((curMax - prevMax) * 10) / 10;
              prevHTML = `<div class="complete-ex-prev">
                <span class="complete-ex-prev-label">ранее:</span>
                <span class="complete-ex-prev-sets">${prevText}</span>
                ${fmtDelta(d, "кг")}
              </div>`;
            }

            return `
      <div class="complete-ex-item">
        <div class="complete-ex-name">${ex.name}</div>
        <div class="complete-ex-sets">${curText}</div>
        ${prevHTML}
      </div>
    `;
          })
          .join("");
        const cur = calcSessionMetrics(record);
        let progressHTML;
        if (!prevRecord) {
          progressHTML = `<div class="complete-progress">
            <div class="complete-progress-title">Прогресс</div>
            <div class="complete-prog-first">🎯 Первая тренировка этого дня</div>
          </div>`;
        } else {
          const prev = calcSessionMetrics(prevRecord);
          progressHTML = `<div class="complete-progress">
            <div class="complete-progress-title">vs ${prevRecord.date}</div>
            <div class="complete-progress-row">
              <div class="complete-prog-card">
                <div class="complete-prog-val">${cur.volume}</div>
                <div class="complete-prog-lbl">объём кг·п</div>
                <div class="complete-prog-delta">${fmtDelta(cur.volume - prev.volume, "кг·п")}</div>
              </div>
              <div class="complete-prog-card">
                <div class="complete-prog-val">${cur.maxWeight}</div>
                <div class="complete-prog-lbl">макс вес кг</div>
                <div class="complete-prog-delta">${fmtDelta(cur.maxWeight - prev.maxWeight, "кг")}</div>
              </div>
              <div class="complete-prog-card">
                <div class="complete-prog-val">${cur.setsCount}</div>
                <div class="complete-prog-lbl">подходов</div>
                <div class="complete-prog-delta">${fmtDelta(cur.setsCount - prev.setsCount, "")}</div>
              </div>
            </div>
          </div>`;
        }

        container.innerHTML = `
    <div class="complete-header">
      <div class="complete-emoji">🏆</div>
      <div class="complete-title">Тренировка завершена!</div>
      <div class="complete-sub">${record.date} · ${record.dayName}</div>
    </div>
    <div class="complete-stats">
      <div class="complete-stat-card">
        <div class="complete-stat-val">${record.durationMin}</div>
        <div class="complete-stat-lbl">минут</div>
      </div>
      <div class="complete-stat-card">
        <div class="complete-stat-val">${record.exercises.length}</div>
        <div class="complete-stat-lbl">упражнений</div>
      </div>
      <div class="complete-stat-card">
        <div class="complete-stat-val">${record.exercises.reduce((acc, ex) => acc + ex.sets.filter((s) => s.done).length, 0)}</div>
        <div class="complete-stat-lbl">подходов</div>
      </div>
      ${
        record.calories
          ? `<div class="complete-stat-card">
        <div class="complete-stat-val">${record.calories}</div>
        <div class="complete-stat-lbl">ккал</div>
      </div>`
          : ""
      }
    </div>
    <div class="complete-exercises">${exListHTML}</div>
    ${progressHTML}
    <div class="complete-backup-prompt">
      <div class="complete-backup-title">Сохрани прогресс</div>
      <div class="complete-backup-sub">Сделай бекап, чтобы не потерять данные</div>
      <div class="complete-backup-btns">
        <button class="complete-backup-btn" onclick="exportBackup()">↑ Бекап</button>
        <button class="complete-backup-btn share" onclick="shareBackup()">⬆ Поделиться</button>
      </div>
    </div>
    <div class="complete-actions">
      <button class="btn-secondary" onclick="switchTab('home')">Новая тренировка</button>
    </div>
  `;
      }

      function exportJSON(recordId) {
        const record = history.find((h) => h.id === recordId);
        if (!record) return;
        const exportData = {
          date: record.dateISO,
          day: record.dayName,
          duration: record.duration,
          exercises: record.exercises.map((ex) => ({
            name: ex.name,
            sets: ex.sets
              .filter((s) => s.weight !== "" || s.reps !== "")
              .map((s) => ({ set: s.set, weight: s.weight, reps: s.reps })),
          })),
        };
        const json = JSON.stringify(exportData, null, 2);
        const blob = new Blob([json], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `workout_${record.dateISO}_day${record.dayId}.json`;
        a.click();
        URL.revokeObjectURL(url);
      }

      // =====================================================
      // BACKUP
      // =====================================================
      function exportBackup() {
        const now = new Date();
        const backup = {
          version: 1,
          createdAt: now.toISOString(),
          programs,
          activeProgramId,
          history,
        };
        const json = JSON.stringify(backup, null, 2);
        const blob = new Blob([json], { type: "application/json" });
        const dateStr = now.toISOString().slice(0, 10);
        downloadBlob(blob, `gymNote_backup_${dateStr}.json`);
        localStorage.setItem("gymNote_lastBackup", now.toISOString());
        updateBackupText();
      }

      function shareBackup() {
        const now = new Date();
        const backup = {
          version: 1,
          createdAt: now.toISOString(),
          programs,
          activeProgramId,
          history,
        };
        const json = JSON.stringify(backup, null, 2);
        const blob = new Blob([json], { type: "application/json" });
        const dateStr = now.toISOString().slice(0, 10);
        const fileName = `gymNote_backup_${dateStr}.json`;
        const file = new File([blob], fileName, { type: "application/json" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator
            .share({ title: "GymTracker бекап", files: [file] })
            .catch(() => downloadBlob(blob, fileName));
        } else {
          downloadBlob(blob, fileName);
        }
        localStorage.setItem("gymNote_lastBackup", now.toISOString());
        updateBackupText();
      }

      function importBackup(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (ev) {
          try {
            const data = JSON.parse(ev.target.result);
            if (!data.programs || !Array.isArray(data.history))
              throw new Error("invalid");
            showConfirm(
              "Восстановить из бекапа?",
              `Бекап от ${new Date(data.createdAt).toLocaleString("ru-RU")}. Все текущие данные будут заменены.`,
              () => {
                programs = data.programs;
                activeProgramId =
                  data.activeProgramId || data.programs[0]?.id || "";
                history = data.history;
                savePrograms();
                saveActiveProgramId();
                saveHistory();
                localStorage.removeItem("gymNote_session");
                session = null;
                localStorage.setItem(
                  "gymNote_lastBackup",
                  new Date().toISOString(),
                );
                renderHistory();
                renderHome();
              },
              null,
              "Восстановить",
              "Отмена",
              true,
            );
          } catch {
            alert("Ошибка: неверный формат бекапа");
          }
        };
        reader.readAsText(file);
        e.target.value = "";
      }

          : "Бекап ещё не делался";

      function getExerciseGroup(exId, exName) {
        for (const prog of programs) {
          for (const day of prog.days) {
            for (const ex of day.exercises) {
              if (ex.id === exId || ex.name === exName) return ex.group;
            }
          }
        }
        return null;
      }

      function getAvailableGroups() {
        const groups = new Set();
        history.forEach((record) => {
          record.exercises.forEach((ex) => {
            const g = ex.group || getExerciseGroup(ex.exId, ex.name);
            if (g) groups.add(g);
          });
        });
        return [...groups].sort();
      }

      function buildChartData(groups) {
        const exerciseData = {};
        history.forEach((record) => {
          record.exercises.forEach((ex) => {
            const g = ex.group || getExerciseGroup(ex.exId, ex.name);
            if (!groups.includes(g)) return;
            const validSets = ex.sets.filter(
              (s) =>
                s.weight !== "" &&
                s.weight !== null &&
                parseFloat(s.weight) > 0,
            );
            if (!validSets.length) return;

            let value;
            if (chartMetric === "max") {
              value = Math.max(
                ...validSets
                  .map((s) => parseFloat(s.weight))
                  .filter((w) => !isNaN(w)),
              );
            } else if (chartMetric === "1rm") {
              value = Math.max(
                ...validSets.map((s) => {
                  const w = parseFloat(s.weight),
                    r = parseFloat(s.reps);
                  return !isNaN(w) && !isNaN(r) && r > 0
                    ? Math.round(w * (1 + r / 30) * 10) / 10
                    : w;
                }),
              );
            } else if (chartMetric === "volume") {
              value = Math.round(
                validSets.reduce((acc, s) => {
                  const w = parseFloat(s.weight),
                    r = parseFloat(s.reps);
                  return acc + (isNaN(w) || isNaN(r) ? 0 : w * r);
                }, 0),
              );
            }
            if (!value || value <= 0) return;
            if (!exerciseData[ex.name]) exerciseData[ex.name] = [];
            exerciseData[ex.name].push({ dateISO: record.dateISO, value });
          });
        });
        return Object.entries(exerciseData)
          .map(([name, points], i) => ({
            name,
            color: CHART_COLORS[i % CHART_COLORS.length],
            points: points.sort((a, b) => a.dateISO.localeCompare(b.dateISO)),
          }))
          .filter((ex) => ex.points.length > 0);
      }

      function renderSVGChart(exercises) {
        const VW = 340,
          VH = 200;
        const padL = 42,
          padR = 12,
          padT = 12,
          padB = 32;
        const plotW = VW - padL - padR;
        const plotH = VH - padT - padB;

        const allDates = [
          ...new Set(
            exercises.flatMap((ex) => ex.points.map((p) => p.dateISO)),
          ),
        ].sort();
        const allVals = exercises.flatMap((ex) =>
          ex.points.map((p) => p.value),
        );
        const minVal = Math.floor(Math.min(...allVals) * 0.9);
        const maxVal = Math.ceil(Math.max(...allVals) * 1.05);
        const valRange = maxVal - minVal || 1;

        const xScale = (d) =>
          padL +
          (allDates.indexOf(d) / Math.max(allDates.length - 1, 1)) * plotW;
        const yScale = (v) => padT + plotH - ((v - minVal) / valRange) * plotH;

        // Grid & Y labels
        let grid = "",
          yLabels = "";
        const yTicks = 4;
        for (let i = 0; i <= yTicks; i++) {
          const v = Math.round(minVal + (valRange / yTicks) * i);
          const y = yScale(v);
          grid += `<line x1="${padL}" y1="${y}" x2="${VW - padR}" y2="${y}" stroke="#38383a" stroke-width="1"/>`;
          yLabels += `<text x="${padL - 5}" y="${y + 4}" text-anchor="end" fill="#8e8e93" font-size="9.5">${v}</text>`;
        }

        // X labels
        const maxXLabels = Math.floor(plotW / 40);
        const step = Math.max(1, Math.ceil(allDates.length / maxXLabels));
        let xLabels = "";
        allDates.forEach((d, i) => {
          if (i % step === 0 || i === allDates.length - 1) {
            const label = d.slice(5).replace("-", "/");
            xLabels += `<text x="${xScale(d)}" y="${VH - 6}" text-anchor="middle" fill="#8e8e93" font-size="9.5">${label}</text>`;
          }
        });

        // Lines + dots
        let lines = "";
        exercises.forEach((ex) => {
          const pts = ex.points
            .map(
              (p) =>
                `${xScale(p.dateISO).toFixed(1)},${yScale(p.value).toFixed(1)}`,
            )
            .join(" ");
          lines += `<polyline points="${pts}" fill="none" stroke="${ex.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
          ex.points.forEach((p) => {
            const cx = xScale(p.dateISO).toFixed(1),
              cy = yScale(p.value).toFixed(1);
            lines += `<circle cx="${cx}" cy="${cy}" r="4" fill="${ex.color}" stroke="#1c1c1e" stroke-width="2"/>`;
            lines += `<text x="${cx}" y="${parseFloat(cy) - 8}" text-anchor="middle" fill="${ex.color}" font-size="9" font-weight="700">${p.value}</text>`;
          });
        });

        const unit = chartMetric === "volume" ? "кг·п" : "кг";
        const unitLabel = `<text x="${padL - 2}" y="${padT - 2}" text-anchor="end" fill="#8e8e93" font-size="8.5">${unit}</text>`;

        return `<svg viewBox="0 0 ${VW} ${VH}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + plotH}" stroke="#38383a" stroke-width="1"/>
    ${grid}${lines}${yLabels}${xLabels}${unitLabel}
  </svg>`;
      }

      function switchChartMetric(metric) {
        chartMetric = metric;
        document
          .querySelectorAll(".metric-btn")
          .forEach((b) =>
            b.classList.toggle("active", b.dataset.metric === metric),
          );
        const container = document.getElementById("progress-view");
        const chartsEl = document.getElementById("progress-charts");
        if (!chartsEl) return;
        let html = "";
        SUPER_GROUPS.forEach((sg) => {
          const exercises = buildChartData(sg.groups);
          if (!exercises.length) return;
          const legendHTML = exercises
            .map(
              (ex) =>
                `<div class="legend-item"><div class="legend-dot" style="background:${ex.color}"></div>${ex.name}</div>`,
            )
            .join("");
          html += `<div class="chart-card"><div class="chart-super-title">${sg.emoji} ${sg.key}</div><div class="chart-super-subtitle">${sg.sub}</div>${renderSVGChart(exercises)}<div class="chart-legend">${legendHTML}</div></div>`;
        });
        chartsEl.innerHTML = html;
      }

      function renderProgress() {
        const container = document.getElementById("progress-view");

        if (!history.length) {
          container.innerHTML =
            '<div class="chart-empty">Завершите несколько тренировок,<br>чтобы увидеть прогресс</div>';
          return;
        }

        const metricToggle = `
    <div class="metric-toggle">
      <button class="metric-btn ${chartMetric === "max" ? "active" : ""}" data-metric="max" onclick="switchChartMetric('max')">Макс вес</button>
      <button class="metric-btn ${chartMetric === "1rm" ? "active" : ""}" data-metric="1rm" onclick="switchChartMetric('1rm')">1ПМ</button>
      <button class="metric-btn ${chartMetric === "volume" ? "active" : ""}" data-metric="volume" onclick="switchChartMetric('volume')">Объём</button>
    </div>`;

        let chartsHTML = "";
        SUPER_GROUPS.forEach((sg) => {
          const exercises = buildChartData(sg.groups);
          if (!exercises.length) return;
          const legendHTML = exercises
            .map(
              (ex) =>
                `<div class="legend-item"><div class="legend-dot" style="background:${ex.color}"></div>${ex.name}</div>`,
            )
            .join("");
          chartsHTML += `<div class="chart-card"><div class="chart-super-title">${sg.emoji} ${sg.key}</div><div class="chart-super-subtitle">${sg.sub}</div>${renderSVGChart(exercises)}<div class="chart-legend">${legendHTML}</div></div>`;
        });

        container.innerHTML =
          metricToggle +
          `<div id="progress-charts">${chartsHTML || '<div class="chart-empty">Нет данных для построения графиков</div>'}</div>`;
      }

        updateBackupText();

          .getElementById("seg-records")
          .classList.toggle("active", historyView === "records");

          .getElementById("seg-progress")
          .classList.toggle("active", historyView === "progress");

          renderProgress();
          return;

        if (history.length === 0) {
          listEl.innerHTML = `
      <div class="history-empty">
        <div class="history-empty-icon">📋</div>
        <div class="history-empty-text">Нет записей тренировок</div>
      </div>
    `;
          return;
        }

        const sorted = [...history].reverse();
        listEl.innerHTML = sorted
          .map((record) => {
            const exDetailHTML = record.exercises
              .map((ex) => {
                const filledSets = ex.sets.filter(
                  (s) => s.weight !== "" || s.reps !== "",
                );
                const setsText = filledSets
                  .map((s) => {
                    const w = s.weight !== "" ? `${s.weight} кг` : "–";
                    const r = s.reps !== "" ? `× ${s.reps}` : "";
                    return `${s.set}. ${w} ${r}`.trim();
                  })
                  .join("<br>");
                return `
        <div class="history-ex-row">
          <div class="history-ex-name">${ex.name}</div>
          <div class="history-ex-sets">${setsText || "–"}</div>
        </div>
      `;
              })
              .join("");

            return `
      <div class="history-item" id="hist-${record.id}">
        <div class="history-item-header" onclick="toggleHistoryItem(${record.id})">
          <div class="history-item-left">
            <div class="history-item-date">${record.date}</div>

        <div class="history-detail">
          ${exDetailHTML}
          <button class="history-delete-btn history-delete-bottom" onclick="deleteHistory(event, ${record.id})">Удалить тренировку</button>
        </div>
      </div>
    `;
          })
          .join("");
      }

      function switchProgramInEdit(id) {
        activeProgramId = id;
        activeProgramDayIdx = 0;
        saveActiveProgramId();
        renderProgram();
      }

      function switchProgramDay(idx) {
        activeProgramDayIdx = idx;
        renderProgram();
      }

      function renderProgramExercises() {
        const day = getActiveDays()[activeProgramDayIdx];
        const listEl = document.getElementById("prog-exercise-list");
        listEl.innerHTML = day.exercises
          .map(
            (ex, i) => `
    <div class="prog-ex-item" id="prog-ex-${ex.id}">
      <div class="prog-ex-content">
        ${ex.group ? `<div style="font-size:10px;color:var(--accent);font-weight:700;margin-bottom:2px">${ex.group}</div>` : ""}
        <div class="prog-ex-name">${ex.name}</div>
        <div class="prog-ex-target">${ex.setsTarget} × ${ex.repsTarget}</div>
      </div>
      <div class="prog-ex-actions">
        <button class="prog-icon-btn" onclick="moveExercise(${i}, -1)" ${i === 0 ? 'disabled style="opacity:0.3"' : ""}>↑</button>
        <button class="prog-icon-btn" onclick="moveExercise(${i}, 1)" ${i === day.exercises.length - 1 ? 'disabled style="opacity:0.3"' : ""}>↓</button>
        <button class="prog-icon-btn" onclick="editExercise(${i})">✏️</button>
        <button class="prog-icon-btn del" onclick="deleteExercise(${i})">✕</button>
      </div>
    </div>
  `,
          )
          .join("");
      }

      function moveExercise(idx, dir) {
        const day = getActiveDays()[activeProgramDayIdx];
        const newIdx = idx + dir;
        if (newIdx < 0 || newIdx >= day.exercises.length) return;
        const arr = day.exercises;
        [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];
        savePrograms();
        renderProgramExercises();
      }

      function editExercise(idx) {
        const day = getActiveDays()[activeProgramDayIdx];
        const ex = day.exercises[idx];
        showEditExerciseModal(ex, (updated) => {
          day.exercises[idx] = { ...ex, ...updated };
          savePrograms();
          renderProgramExercises();
        });
      }

      function deleteExercise(idx) {
        showConfirm(
          "Удалить упражнение?",
          "Это действие нельзя отменить.",
          () => {
            getActiveDays()[activeProgramDayIdx].exercises.splice(idx, 1);
            savePrograms();
            renderProgramExercises();
          },
          null,
          "Удалить",
          "Отмена",
          true,
        );
      }

      function openAddExercise() {
        const newEx = {
          id: "e_" + Date.now(),
          name: "",
          setsTarget: 3,
          repsTarget: "10",
          group: null,
        };
        showEditExerciseModal(
          newEx,
          (updated) => {
            if (!updated.name.trim()) return;
            getActiveDays()[activeProgramDayIdx].exercises.push({
              ...newEx,
              ...updated,
            });
            savePrograms();
            renderProgramExercises();
          },
          true,
        );
      }

      <span class="prog-mgr-emoji">${p.emoji}</span>

        showModal(`
