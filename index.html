      <button class="modal-btn-save" onclick="document.getElementById('import-program-input').click()">Импортировать JSON</button>
    </div>
  `);
      }

      function exportProgram(id) {
        const prog = programs.find((p) => p.id === id);
        if (!prog) return;
        const json = JSON.stringify(
          { name: prog.name, emoji: prog.emoji, days: prog.days },
          null,
          2,
        );
        const blob = new Blob([json], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `program_${prog.name.replace(/\s+/g, "_")}.json`;
        a.click();
        URL.revokeObjectURL(url);
      }

      function deleteProgram(id) {
        if (programs.length <= 1) {
          alert("Нельзя удалить последнюю программу");
          return;
        }
        closeModal();
        showConfirm(
          "Удалить программу?",
          "Это действие нельзя отменить.",
          () => {
            programs = programs.filter((p) => p.id !== id);
            if (activeProgramId === id) activeProgramId = programs[0].id;
            savePrograms();
            saveActiveProgramId();
            renderHome();
          },
          null,
          "Удалить",
          "Отмена",
          true,
        );
      }

      function importProgramFromFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (ev) {
          try {
            const data = JSON.parse(ev.target.result);
            if (!data.days || !Array.isArray(data.days))
              throw new Error("Invalid format");
            const id = "prog_" + Date.now();
            programs.push({
              id,
              name: data.name || "Импортированная",
              emoji: data.emoji || "📥",
              days: data.days,
            });
            activeProgramId = id;
            savePrograms();
            saveActiveProgramId();
            renderHome();
            closeModal();
          } catch (err) {
            alert("Ошибка импорта: неверный формат файла");
          }
        };
        reader.readAsText(file);
        e.target.value = "";
      }

      // =====================================================
      // MODALS
      // =====================================================
      function showModal(html) {
        const container = document.getElementById("modal-container");
        container.innerHTML = `
    <div class="modal-overlay" id="modal-overlay" onclick="closeModalOnBg(event)">
      <div class="modal-sheet">
        ${html}
      </div>
    </div>
  `;
      }

      function closeModal() {
        document.getElementById("modal-container").innerHTML = "";
      }

      function closeModalOnBg(e) {
        if (e.target.id === "modal-overlay") closeModal();
      }

      function showConfirm(
        title,
        text,
        onConfirm,
        onCancel,
        confirmLabel = "Подтвердить",
        cancelLabel = "Отмена",
        isDanger = false,
      ) {
        const btnClass = isDanger ? "modal-btn-danger" : "modal-btn-save";
        showModal(`
    <div class="modal-title">${title}</div>
    <div class="confirm-text">${text}</div>
    <div class="modal-actions">
      <button class="modal-btn-cancel" onclick="closeModal();${onCancel ? "modalOnCancel()" : ""}">${cancelLabel}</button>
      <button class="${btnClass}" onclick="closeModal();modalOnConfirm()">${confirmLabel}</button>
    </div>
  `);
        window.modalOnConfirm = onConfirm || (() => {});
        window.modalOnCancel = onCancel || (() => {});
      }

      function showEditExerciseModal(ex, onSave, isNew = false) {
        showModal(`
    <div class="modal-title">${isNew ? "Новое упражнение" : "Редактировать"}</div>
    <div class="modal-field">
      <div class="modal-label">Название</div>
      <input class="modal-input" id="edit-name" type="text" value="${ex.name}" placeholder="Название упражнения">
    </div>
    <div class="modal-field">
      <div class="modal-label">Подходов</div>
      <input class="modal-input" id="edit-sets" type="number" inputmode="numeric" value="${ex.setsTarget}">
    </div>
    <div class="modal-field">
      <div class="modal-label">Повторений (цель)</div>
      <input class="modal-input" id="edit-reps" type="text" value="${ex.repsTarget}" placeholder="н-р: 8–10">
    </div>
    <div class="modal-field">
      <div class="modal-label">Группа (ПРЕСС, СУПЕРСЕТ и т.д.)</div>
      <input class="modal-input" id="edit-group" type="text" value="${ex.group || ""}" placeholder="Оставьте пустым если нет">
    </div>
    <div class="modal-actions">
      <button class="modal-btn-cancel" onclick="closeModal()">Отмена</button>
      <button class="modal-btn-save" onclick="saveEditExercise()">Сохранить</button>
    </div>
  `);
        window.modalEditSave = onSave;
      }

      function saveEditExercise() {
        const name = document.getElementById("edit-name").value.trim();
        const setsTarget =
          parseInt(document.getElementById("edit-sets").value) || 3;
        const repsTarget =
          document.getElementById("edit-reps").value.trim() || "10";
        const groupVal = document.getElementById("edit-group").value.trim();
        const group = groupVal || null;
        closeModal();
        if (window.modalEditSave) {
          window.modalEditSave({ name, setsTarget, repsTarget, group });
        }
      }

      // =====================================================
      // INIT
      // =====================================================
      function init() {
        loadData();
        renderHome();
        initSwipeListeners();
        if (session) startWorkoutTimers(true);
      }

      init();
    </script>
  </body>
</html>
